name: Android APK fork verification
on:
  push:
    branches:
      - test/android-release-apks
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      ref: ${{ github.sha }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      release_channel: nightly
    steps:
      - id: meta
        run: >-
          echo "version=0.0.0-apk-test.$GITHUB_RUN_NUMBER.nightly" >>
          "$GITHUB_OUTPUT"

          echo "tag=apk-ci-test-$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
  android_apk:
    name: Build Android APK
    needs:
      - preflight
    uses: ./.github/workflows/release-android.yml
    with:
      ref: ${{ needs.preflight.outputs.ref }}
      version: ${{ needs.preflight.outputs.version }}
      release_channel: ${{ needs.preflight.outputs.release_channel }}
    secrets:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  stable_apk:
    needs:
      - preflight
      - android_apk
    uses: ./.github/workflows/release-android.yml
    with:
      ref: ${{ github.sha }}
      version: ${{ format('0.0.0-apk-test.{0}.stable', github.run_number) }}
      release_channel: stable
    secrets:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  without_token:
    uses: ./.github/workflows/release-android.yml
    with:
      ref: ${{ github.sha }}
      version: missing-token-test
      release_channel: stable
  verify_skip:
    needs:
      - without_token
    runs-on: ubuntu-24.04
    env:
      APK_AVAILABLE: ${{ needs.without_token.outputs.available }}
    steps:
      - run: test "$APK_AVAILABLE" = false
  release:
    needs:
      - preflight
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
    steps:
      - run: gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create
          "$RELEASE_TAG" --draft --target "$GITHUB_SHA" --title "Android APK CI
          test" --notes "Isolated fork verification. Test package IDs and
          temporary signing keys."
  publish_android_apk:
    name: Attach Android APK to GitHub Release
    needs:
      - preflight
      - android_apk
      - release
    if: ${{ !cancelled() && needs.android_apk.result == 'success' &&
      needs.android_apk.outputs.available == 'true' && needs.release.result ==
      'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download signed Android APK
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.android_apk.outputs.artifact_name }}
          path: android-assets
      - name: Verify and upload APK
        working-directory: android-assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          sha256sum --check ./*.apk.sha256
          gh release upload "$RELEASE_TAG" ./*.apk ./*.apk.sha256 --clobber
  publish_stable_apk:
    name: Attach stable test APK
    needs:
      - preflight
      - stable_apk
      - release
    if: ${{ !cancelled() && needs.stable_apk.result == 'success' &&
      needs.stable_apk.outputs.available == 'true' && needs.release.result ==
      'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download signed Android APK
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.stable_apk.outputs.artifact_name }}
          path: android-assets
      - name: Verify and upload APK
        working-directory: android-assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          sha256sum --check ./*.apk.sha256
          gh release upload "$RELEASE_TAG" ./*.apk ./*.apk.sha256 --clobber
