name: Release Android APK

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      version:
        required: true
        type: string
      release_channel:
        required: true
        type: string
    secrets:
      EXPO_TOKEN:
        required: false
    outputs:
      available:
        value: ${{ jobs.build.outputs.available }}
      artifact_name:
        value: ${{ jobs.build.outputs.artifact_name }}
  workflow_dispatch:
    inputs:
      release_channel:
        description: APK profile to test (saves an Actions artifact without publishing)
        required: true
        default: nightly
        type: choice
        options:
          - nightly
          - stable

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.release_channel }} APK
    if: inputs.release_channel != 'preview'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      available: ${{ steps.upload.outcome == 'success' }}
      artifact_name: android-apk-${{ inputs.release_channel }}
    env:
      APP_VARIANT: ${{ inputs.release_channel == 'stable' && 'production' || 'preview' }}
      T3CODE_MOBILE_UPDATES_ENABLED: "0"
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - id: expo-token
        name: Check for EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "EXPO_TOKEN is not available; skipping Android APK build." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout release commit
        if: steps.expo-token.outputs.present == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Setup Vite+
        if: steps.expo-token.outputs.present == 'true'
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/mobile...

      - name: Expose pnpm
        if: steps.expo-token.outputs.present == 'true'
        run: |
          pnpm_version="$(node --print "require('./package.json').packageManager.split('@').pop()")"
          echo "$HOME/.vite-plus/package_manager/pnpm/$pnpm_version/pnpm/bin" >> "$GITHUB_PATH"

      - name: Setup EAS
        if: steps.expo-token.outputs.present == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Pull mobile environment
        if: steps.expo-token.outputs.present == 'true'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_ENVIRONMENT: ${{ inputs.release_channel == 'stable' && 'production' || 'preview' }}
        run: eas env:pull "$EAS_ENVIRONMENT" --non-interactive

      - name: Build signed APK
        if: steps.expo-token.outputs.present == 'true'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          RELEASE_CHANNEL: ${{ inputs.release_channel }}
        run: |
          case "$RELEASE_CHANNEL" in
            stable) profile=github-release ;;
            nightly) profile=github-nightly ;;
            *) echo "Unsupported APK channel: $RELEASE_CHANNEL" >&2; exit 1 ;;
          esac
          eas build --platform android --profile "$profile" --non-interactive --wait --json > "$RUNNER_TEMP/android-build.json"

      - name: Download and verify APK
        if: steps.expo-token.outputs.present == 'true'
        env:
          RELEASE_VERSION: ${{ inputs.version || format('test.{0}', github.run_number) }}
        run: |
          set -euo pipefail
          if ! [[ "$RELEASE_VERSION" =~ ^[A-Za-z0-9][A-Za-z0-9.+-]*$ ]]; then
            echo "Invalid APK release version." >&2
            exit 1
          fi
          node .github/scripts/resolve-android-apk.cjs "$RUNNER_TEMP/android-build.json" "$(git rev-parse HEAD)" > "$RUNNER_TEMP/android-artifact.json"
          mkdir -p android-assets
          apk="android-assets/t3-code-$RELEASE_VERSION-android.apk"
          curl --fail --location --retry 3 --output "$apk" "$(jq -r '.url' "$RUNNER_TEMP/android-artifact.json")"
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          "$apksigner" verify --verbose --print-certs "$apk"
          unzip -t "$apk" > /dev/null
          cd android-assets
          sha256sum ./*.apk > "$(basename "$apk").sha256"
          echo "Built Android APK from $(git rev-parse HEAD), EAS build $(jq -r '.id' "$RUNNER_TEMP/android-artifact.json")." >> "$GITHUB_STEP_SUMMARY"

      - id: upload
        name: Save APK artifact
        if: steps.expo-token.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: android-apk-${{ inputs.release_channel }}
          path: android-assets/
          if-no-files-found: error
